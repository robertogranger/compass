name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-web:
    name: Web (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test:web

      - name: Upload results to Zephyr
        if: always()
        run: |
          curl -H "Authorization: Bearer ${{ secrets.ZEPHYR_API_TOKEN }}" \
            -F "file=@apps/web/test-results/junit.xml;type=application/xml" \
            "https://api.zephyrscale.smartbear.com/v2/automations/executions/junit?projectKey=COM&autoCreateTestCases=true"

  test-api:
    name: API (JUnit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compass_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/api/gradlew

      - name: Run API tests
        working-directory: apps/api
        run: ./gradlew test

      - name: Zip JUnit XML results
        if: always()
        working-directory: apps/api
        run: cd build/test-results/test && zip -r ../../../junit-results.zip .

      - name: Upload results to Zephyr
        if: always()
        env:
          ZEPHYR_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
        run: |
          curl -v -H "Authorization: Bearer ${ZEPHYR_TOKEN}" \
            -F "file=@apps/web/test-results/junit.xml;type=application/xml" \
            "https://api.zephyrscale.smartbear.com/v2/automations/executions/junit?projectKey=COM&autoCreateTestCases=true"

  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [test-web, test-api]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload results to Zephyr
        if: always()
        run: |
          curl -H "Authorization: Bearer ${{ secrets.ZEPHYR_API_TOKEN }}" \
            -F "file=@test-results/junit.xml;type=application/xml" \
            "https://api.zephyrscale.smartbear.com/v2/automations/executions/junit?projectKey=COM&autoCreateTestCases=true"